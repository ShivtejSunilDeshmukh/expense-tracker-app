name: Expense Tracker CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - "K8s/**"

  pull_request:
    branches:
      - main

# Allow GitHub Actions to update K8s manifests
permissions:
  contents: write

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}

jobs:

  # ============================================================
  # JOB 1: TEST APPLICATION
  # ============================================================

  test:
    name: Test Application
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------------
      # Checkout repository
      # --------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # Setup Node.js
      # --------------------------------------------------------

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # --------------------------------------------------------
      # Install backend dependencies
      # --------------------------------------------------------

      - name: Install backend dependencies
        working-directory: app/backend
        run: npm install

      # --------------------------------------------------------
      # Check backend JavaScript syntax
      # --------------------------------------------------------

      - name: Check backend syntax
        working-directory: app/backend
        run: node --check server.js

      # --------------------------------------------------------
      # Start backend and test health endpoint
      # --------------------------------------------------------

      - name: Test backend health endpoint
        working-directory: app/backend
        run: |

          npm start > server.log 2>&1 &

          echo "Waiting for backend to start..."

          for i in {1..10}; do

            if curl --fail http://localhost:3000/api/health; then
              echo ""
              echo "Backend health check passed!"
              exit 0
            fi

            echo "Backend not ready yet..."
            sleep 2

          done

          echo "Backend failed to start."

          echo "Backend logs:"
          cat server.log

          exit 1


  # ============================================================
  # JOB 2: BUILD DOCKER IMAGE
  # ============================================================

  build:
    name: Build Docker Image
    runs-on: ubuntu-latest

    needs:
      - test

    steps:

      # --------------------------------------------------------
      # Checkout repository
      # --------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # Build Docker image
      # --------------------------------------------------------

      - name: Build Docker image
        run: |

          docker build \
            -t expense-tracker:${{ github.sha }} \
            ./app

      # --------------------------------------------------------
      # Verify Docker image
      # --------------------------------------------------------

      - name: Verify Docker image
        run: |

          docker images

          docker inspect expense-tracker:${{ github.sha }}


  # ============================================================
  # JOB 3: PUSH IMAGE TO ECR + UPDATE GITOPS MANIFEST
  # ============================================================

  push-to-ecr:
    name: Push Image to ECR
    runs-on: ubuntu-latest

    needs:
      - build

    # Only push images and update GitOps manifests
    # for direct pushes to main.
    if: >
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'

    steps:

      # --------------------------------------------------------
      # Checkout repository
      # --------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # Configure AWS credentials
      # --------------------------------------------------------

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      # --------------------------------------------------------
      # Login to Amazon ECR
      # --------------------------------------------------------

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # --------------------------------------------------------
      # Create complete image URI
      # --------------------------------------------------------

      - name: Set Docker image URI
        run: |

          IMAGE_URI="${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}"

          echo "IMAGE_URI=${IMAGE_URI}" >> "$GITHUB_ENV"

          echo "Docker image URI:"
          echo "${IMAGE_URI}"


      # ========================================================
      # DOCKER
      # ========================================================

      # --------------------------------------------------------
      # Build Docker image for ECR
      # --------------------------------------------------------

      - name: Build Docker image
        run: |

          docker build \
            -t "${IMAGE_URI}" \
            ./app


      # --------------------------------------------------------
      # Push Docker image to ECR
      # --------------------------------------------------------

      - name: Push Docker image to ECR
        run: |

          docker push "${IMAGE_URI}"


      # --------------------------------------------------------
      # Display pushed image
      # --------------------------------------------------------

      - name: Display image URI
        run: |

          echo "=========================================="
          echo "Docker image pushed successfully"
          echo "=========================================="
          echo "${IMAGE_URI}"
          echo "=========================================="


      # ========================================================
      # GITOPS
      # ========================================================

      # --------------------------------------------------------
      # Update Kubernetes deployment image
      # --------------------------------------------------------

      - name: Update Kubernetes image
        run: |

          echo "Updating Kubernetes deployment..."

          sed -i "s|^[[:space:]]*image:.*|          image: ${IMAGE_URI}|" K8s/deployment.yaml

          echo ""
          echo "Updated Kubernetes image:"
          echo "------------------------------------------"

          grep "image:" K8s/deployment.yaml

          echo "------------------------------------------"


      # --------------------------------------------------------
      # Show Git diff
      # --------------------------------------------------------

      - name: Show Kubernetes changes
        run: |

          echo "Git diff:"
          echo "=========================================="

          git diff -- K8s/deployment.yaml

          echo "=========================================="


      # --------------------------------------------------------
      # Configure Git
      # --------------------------------------------------------

      - name: Configure Git
        run: |

          git config user.name "github-actions[bot]"

          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"


      # --------------------------------------------------------
      # Commit Kubernetes manifest
      # --------------------------------------------------------

      - name: Commit Kubernetes manifest
        run: |

          git add K8s/deployment.yaml

          if git diff --cached --quiet; then

            echo "No Kubernetes manifest changes detected."

            exit 0

          fi

          git commit \
            -m "Update image to ${GITHUB_SHA}"


      # --------------------------------------------------------
      # Push Kubernetes manifest to GitHub
      # --------------------------------------------------------

      - name: Push Kubernetes manifest
        run: |

          git push origin HEAD:main
