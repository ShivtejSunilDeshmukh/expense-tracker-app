name: Expense Tracker CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}

jobs:

  # ==========================================
  # JOB 1 - Test Application
  # ==========================================

  test:
    name: Test Application
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install backend dependencies
        working-directory: app/backend
        run: npm install

      - name: Check backend syntax
        working-directory: app/backend
        run: node --check server.js

      - name: Test backend health endpoint
        working-directory: app/backend
        run: |
          npm start &
          sleep 5

          curl --fail http://localhost:3000/api/health

  # ==========================================
  # JOB 2 - Build Docker Image
  # ==========================================

  build:
    name: Build Docker Image
    runs-on: ubuntu-latest

    needs:
      - test

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            -t expense-tracker:${{ github.sha }} \
            ./app

      - name: Verify Docker image
        run: |
          docker images
          docker inspect expense-tracker:${{ github.sha }}

  # ==========================================
  # JOB 3 - Push Image to Amazon ECR
  # ==========================================

  push-to-ecr:
    name: Push Image to ECR
    runs-on: ubuntu-latest

    needs:
      - build

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------
      # Configure AWS credentials
      # --------------------------------------

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      # --------------------------------------
      # Login to Amazon ECR
      # --------------------------------------

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # --------------------------------------
      # Build image
      # --------------------------------------

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }} \
            ./app

      # --------------------------------------
      # Push image
      # --------------------------------------

      - name: Push Docker image to ECR
        run: |
          docker push \
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}

      # --------------------------------------
      # Display image
      # --------------------------------------

      - name: Display image URI
        run: |
          echo "Docker image pushed successfully:"
          echo "${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}"
