apiVersion: apps/v1
kind: Deployment

metadata:
  name: expense-tracker
  namespace: expense-tracker

spec:
  replicas: 2

  selector:
    matchLabels:
      app: expense-tracker

  template:

    metadata:
      labels:
        app: expense-tracker

    spec:

      containers:
        - name: expense-tracker

          image: 720204292745.dkr.ecr.ap-south-1.amazonaws.com/ssd-argocd-eks:6b23458067397b53a29d970e3b253404087df423

          ports:
            - containerPort: 80

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"

            limits:
              cpu: "500m"
              memory: "512Mi"

          readinessProbe:
            httpGet:
              path: /api/health
              port: 80

            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /api/health
              port: 80

            initialDelaySeconds: 15
            periodSeconds: 20
