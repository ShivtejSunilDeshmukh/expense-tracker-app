apiVersion: apps/v1
kind: Deployment

metadata:
  name: expense-tracker
  namespace: expense-tracker

spec:
  replicas: 2

  selector:
    matchLabels:
      app: expense-tracker

  template:

    metadata:
      labels:
        app: expense-tracker

    spec:

      containers:
        - name: expense-tracker

          image: IMAGE_PLACEHOLDER

          ports:
            - containerPort: 80

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"

            limits:
              cpu: "500m"
              memory: "512Mi"

          readinessProbe:
            httpGet:
              path: /api/health
              port: 80

            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /api/health
              port: 80

            initialDelaySeconds: 15
            periodSeconds: 20
